# memcyco URL shortener stack
#
# One command, self-contained, runs anywhere:
#
#     docker compose up -d --build
#
# Starts postgres, redis, backend, and frontend on a private bridge network.
# No external networks or pre-existing containers required. Open:
#     frontend  http://localhost:5173
#     backend   http://localhost:8080  (Swagger: /swagger-ui.html)
#
# Optional: reuse a Redis you already run on the host instead of the bundled one:
#     SPRING_DATA_REDIS_HOST=host.docker.internal docker compose up -d --build
#   (the bundled redis still starts but goes unused; harmless.)
#
# Cleanup: `docker compose down -v` (the -v drops the memcyco_pgdata volume).

name: memcyco

services:
  postgres:
    image: postgres:16-alpine
    container_name: memcyco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memcyco
      POSTGRES_USER: memcyco
      POSTGRES_PASSWORD: memcyco
    ports:
      # Host-side 5432 for convenience (psql from the host). If something else
      # already uses 5432 on your machine, change the host side to e.g. 5433.
      - "5432:5432"
    volumes:
      - memcyco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memcyco -d memcyco"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - memcyco

  redis:
    image: redis:7-alpine
    container_name: memcyco-redis
    restart: unless-stopped
    # Not published to the host: only the backend talks to it, over the private
    # network. Keeping it internal avoids clashing with a Redis the reviewer may
    # already run on host port 6379.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - memcyco

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memcyco-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memcyco
      SPRING_DATASOURCE_USERNAME: memcyco
      SPRING_DATASOURCE_PASSWORD: memcyco
      # Defaults to the bundled `redis` service. Override to point at a host
      # Redis (e.g. host.docker.internal) without editing this file.
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_PROFILES_ACTIVE: docker
    # Lets the optional host-Redis override above resolve on Linux too, where
    # host.docker.internal isn't wired up by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    networks:
      - memcyco

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memcyco-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    healthcheck:
      # Hit the SPA root through nginx; -q/-O- keeps it silent + non-blocking.
      test: ["CMD-SHELL", "wget -q -O- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - memcyco

volumes:
  memcyco_pgdata:
    name: memcyco_pgdata

networks:
  memcyco:
    name: memcyco
    driver: bridge
