spring:
  application:
    name: memcyco-shortener
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memcyco}
    username: ${SPRING_DATASOURCE_USERNAME:memcyco}
    password: ${SPRING_DATASOURCE_PASSWORD:memcyco}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. JPA only reads/writes; no schema management or validation.
      # (Validation was rejecting TEXT[] vs Hibernate's narrower array type mapping.)
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        generate_statistics: ${HIBERNATE_STATS:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 250ms

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    short-link-ttl-seconds: 300
    not-found-ttl-seconds: 60
  click-tracker:
    queue-capacity: 10000
    batch-size: 100
    flush-interval-ms: 500
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:false}
    redirect-per-ip-per-minute: 60
  geo:
    enabled: ${APP_GEO_ENABLED:false}
    db-path: ${APP_GEO_DB_PATH:/data/GeoLite2-City.mmdb}

logging:
  level:
    com.memcyco: INFO
    org.hibernate.SQL: WARN
