spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        # Enabled so cache-hit tests can verify zero SELECTs against short_links.
        generate_statistics: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 0
  error:
    include-message: always
    include-binding-errors: always

app:
  base-url: http://localhost:8080
  cache:
    short-link-ttl-seconds: 300
    not-found-ttl-seconds: 60
  click-tracker:
    queue-capacity: 10000
    batch-size: 100
    # Tight flush window so integration tests don't have to wait long for clicks to land.
    flush-interval-ms: 100
  rate-limit:
    # Disabled by default; specific tests override via @TestPropertySource.
    enabled: false
    redirect-per-ip-per-minute: 60
  geo:
    enabled: false
    db-path: /unused/in/tests

logging:
  level:
    com.memcyco: INFO
    org.hibernate.SQL: WARN
    org.testcontainers: INFO
