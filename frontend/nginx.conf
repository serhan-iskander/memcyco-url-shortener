# nginx config for the memcyco SPA + backend reverse proxy.
#
# Routing model:
#   * /api/*           → proxied to the `backend` service in docker-compose.
#   * everything else  → served as static files from the Vite build, falling
#                        back to /index.html so React Router can handle the
#                        URL on the client.
#
# Bare short-code redirects (e.g. http://localhost:8080/aB3xK7q) are NOT
# proxied here — they hit the backend directly on its own published port.
# The frontend container is purely UI; the short-code path lives on the
# backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed static assets emitted by Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the JSON API to the backend container.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — any non-asset, non-/api/ path resolves to index.html so
    # the React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose hidden files (.env, .git, etc.) if accidentally copied in.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
